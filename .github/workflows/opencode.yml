name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Prepare OpenCode auth
        shell: bash
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
        run: |
          set -euo pipefail
          umask 077

          auth_dir="$HOME/.local/share/opencode"
          auth_file="$auth_dir/auth.json"
          install -d -m 700 "$auth_dir"
          printf '%s' "$OPENCODE_AUTH_CONTENT" | jq -e . > "$auth_file"
          chmod 600 "$auth_file"
          filtered_auth="$(jq -ce 'if .openai then {openai: .openai} else empty end' "$auth_file")"
          echo "OPENCODE_AUTH_HASH=$(printf '%s' "$filtered_auth" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"*":"allow","doom_loop":"deny","question":"deny"}'
          OPENCODE_CONFIG_CONTENT: |
            {
              "provider": {
                "openai": {
                  "models": {
                    "gpt-6-astra": {
                      "options": {
                        "reasoningEffort": "high"
                      }
                    }
                  }
                }
              }
            }
        with:
          model: openai/gpt-6-astra
          use_github_token: true
          variant: high
          mentions: /opencode,/oc
          share: false

      - name: Persist rotated OpenCode auth
        if: ${{ always() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          auth_file="$HOME/.local/share/opencode/auth.json"
          if [ ! -s "$auth_file" ]; then
            echo "::notice::OpenCode auth file was not updated; skipping auth persistence."
            exit 0
          fi

          filtered_auth="$(jq -ce 'if .openai then {openai: .openai} else empty end' "$auth_file")" || {
            echo "::warning::OpenCode auth file does not contain OpenAI auth; skipping auth persistence."
            exit 0
          }
          echo "::add-mask::$filtered_auth"

          current_auth_hash="$(printf '%s' "$filtered_auth" | sha256sum | cut -d' ' -f1)"
          if [ "$current_auth_hash" = "$OPENCODE_AUTH_HASH" ]; then
            echo "::notice::OpenCode auth did not change; skipping auth persistence."
            exit 0
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          app_response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg owner "$owner" --arg repo "$repo" '{owner: $owner, repo: $repo}')" \
            https://api.opencode.ai/exchange_github_app_token_with_pat)"
          app_token="$(jq -r '.token' <<<"$app_response")"
          echo "::add-mask::$app_token"

          printf '%s' "$filtered_auth" | GH_TOKEN="$app_token" gh secret set OPENCODE_AUTH_CONTENT --repo "$GITHUB_REPOSITORY"
